# The pipeline of switch-service, for GitLab.
#
# This file and .github/workflows/ci.yml do the SAME thing. Keep the one that
# matches your platform and delete the other. Two live pipelines drift apart
# and then nobody knows which one is the real gate.
#
# The shape that matters:
#
#   test  ->  contract-gate  ->  deploy
#
# `deploy` depends on `contract-gate`. That single dependency is what stops a
# broken contract from reaching production.

stages:
  - test
  - gate
  - deploy

default:
  image: node:20
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  # Pact versions are git commits, so the history must be real.
  GIT_DEPTH: '0'
  POSTGRES_USER: pact
  POSTGRES_PASSWORD: pact
  POSTGRES_DB: postgres
  PACT_BRANCH: $CI_COMMIT_REF_NAME

.with_infra:
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    PGHOST: postgres
    PGPASSWORD: pact

test:
  stage: test
  extends: .with_infra
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - psql -h postgres -U pact -d postgres -c 'CREATE DATABASE switch_db;'
    - psql -h postgres -U pact -d postgres -c 'CREATE DATABASE switch_test_db;'
    - npm run typecheck
    - npm run test:unit
    - npm run test:integration
    - npm run console:build
    - npm run build
  variables:
    INTEGRATION_DATABASE_URL: postgres://pact:pact@postgres:5432/switch_test_db
    INTEGRATION_REDIS_URL: redis://redis:6379/3

contract-gate:
  # THE GATE. A deploy is not allowed to start until this passes.
  stage: gate
  extends: .with_infra
  needs: [test]
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - psql -h postgres -U pact -d postgres -c 'CREATE DATABASE switch_test_db;'
    - bash ci/contract-gate.sh
  variables:
    # The broker is ONE long-lived shared service. Do not start it inside the
    # pipeline: a fresh broker is empty, and can-i-deploy then compares this
    # version against nothing at all.
    #
    # Set PACT_BROKER_BASE_URL, PACT_BROKER_USERNAME and PACT_BROKER_PASSWORD
    # as masked CI variables in the project settings.
    PACT_RETRY_WHILE_UNKNOWN: 'true'
    PACT_RETRY_TIMEOUT_SECONDS: '300'
    PACT_DATABASE_URL: postgres://pact:pact@postgres:5432/switch_test_db
    PACT_REDIS_URL: redis://redis:6379/1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pacts/
      - logs/

deploy:
  stage: deploy
  needs: [contract-gate]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
  script:
    - echo "Put the real deploy here."
    - echo "The contract gate has already passed, so this version is safe to ship."
    # Without this record, "can-i-deploy against production" has no idea what
    # production is running, and the next gate answers "unknown".
    - PACT_ENVIRONMENT=production npm run pact:record-deployment
